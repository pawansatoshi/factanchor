<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FactAnchor — Live GenLayer Claim Resolver</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; color: #1a1a1a; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .sub { color: #666; font-size: 0.9rem; margin-bottom: 24px; }
  input, textarea { width: 100%; padding: 10px; margin: 6px 0 14px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95rem; box-sizing: border-box; }
  button { width: 100%; padding: 12px; background: #111; color: #fff; border: none; border-radius: 6px; font-size: 0.95rem; margin-bottom: 8px; }
  button:disabled { background: #999; }
  .card { border: 1px solid #eee; border-radius: 8px; padding: 14px; margin: 14px 0; background: #fafafa; }
  .status { font-size: 0.85rem; color: #444; word-break: break-word; }
  .addr { font-family: monospace; font-size: 0.8rem; color: #888; }
  a { color: #2563eb; }
</style>
</head>
<body>

<h1>FactAnchor</h1>
<div class="sub">
  Web-grounded claim resolution, live on GenLayer Bradbury Testnet.<br/>
  Contract: <span class="addr" id="contractAddr">loading…</span>
</div>

<button id="connectBtn">Connect Wallet</button>
<div class="status" id="walletStatus"></div>

<div class="card">
  <strong>Submit a claim</strong>
  <input id="claimText" placeholder="e.g. Did the Fed cut rates on July 30 2026?" />
  <input id="sourceUrl" placeholder="Source URL validators will check" />
  <button id="submitBtn" disabled>Submit Claim</button>
  <div class="status" id="submitStatus"></div>
</div>

<div class="card">
  <strong>Resolve a claim</strong>
  <input id="resolveId" type="number" placeholder="Claim ID" />
  <button id="resolveBtn" disabled>Resolve Claim</button>
  <div class="status" id="resolveStatus"></div>
</div>

<div class="card">
  <strong>Look up a claim</strong>
  <input id="lookupId" type="number" placeholder="Claim ID" />
  <button id="lookupBtn">Get Claim</button>
  <div class="status" id="lookupStatus"></div>
</div>

<script type="module">
  import { createClient } from "https://esm.sh/genlayer-js@latest";
  import { testnetAsimov } from "https://esm.sh/genlayer-js@latest/chains";

  // ---- Fill this in after confirming your deployed address ----
  const CONTRACT_ADDRESS = "0xE1a4780dc431a16f41cf17F44F60a4A503e55cf0";
  const ABI_FUNCTIONS = ["submit_claim", "resolve_claim", "get_claim", "total_claims"];
  // ----------------------------------------------------------------

  document.getElementById("contractAddr").textContent = CONTRACT_ADDRESS;

  let client = null;
  let account = null;

  const connectBtn = document.getElementById("connectBtn");
  const walletStatus = document.getElementById("walletStatus");
  const submitBtn = document.getElementById("submitBtn");
  const resolveBtn = document.getElementById("resolveBtn");

  connectBtn.addEventListener("click", async () => {
    if (!window.ethereum) {
      walletStatus.textContent = "No injected wallet found — open this page inside your wallet's dapp browser.";
      return;
    }
    try {
      const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
      account = accounts[0];

      client = createClient({
        chain: testnetAsimov, // GenLayer's current public testnet chain config
        account: account,     // address only — wallet handles signing via injected provider
      });

      walletStatus.textContent = `Connected: ${account}`;
      submitBtn.disabled = false;
      resolveBtn.disabled = false;
    } catch (err) {
      walletStatus.textContent = "Connection failed: " + err.message;
    }
  });

  document.getElementById("submitBtn").addEventListener("click", async () => {
    const claimText = document.getElementById("claimText").value.trim();
    const sourceUrl = document.getElementById("sourceUrl").value.trim();
    const statusEl = document.getElementById("submitStatus");
    if (!claimText || !sourceUrl) {
      statusEl.textContent = "Fill in both fields first.";
      return;
    }
    statusEl.textContent = "Sending transaction…";
    try {
      const txHash = await client.writeContract({
        address: CONTRACT_ADDRESS,
        functionName: "submit_claim",
        args: [claimText, sourceUrl],
        account,
      });
      statusEl.textContent = "Submitted. Tx: " + txHash;
      const receipt = await client.waitForTransactionReceipt({ hash: txHash });
      statusEl.textContent = "Confirmed. Claim ID: " + JSON.stringify(receipt.result ?? receipt);
    } catch (err) {
      statusEl.textContent = "Error: " + err.message;
    }
  });

  document.getElementById("resolveBtn").addEventListener("click", async () => {
    const claimId = document.getElementById("resolveId").value;
    const statusEl = document.getElementById("resolveStatus");
    if (claimId === "") {
      statusEl.textContent = "Enter a claim ID first.";
      return;
    }
    statusEl.textContent = "Requesting validator consensus… this can take a bit.";
    try {
      const txHash = await client.writeContract({
        address: CONTRACT_ADDRESS,
        functionName: "resolve_claim",
        args: [Number(claimId)],
        account,
      });
      await client.waitForTransactionReceipt({ hash: txHash });
      statusEl.textContent = "Resolved. Check it below via Get Claim.";
    } catch (err) {
      statusEl.textContent = "Error: " + err.message;
    }
  });

  document.getElementById("lookupBtn").addEventListener("click", async () => {
    const claimId = document.getElementById("lookupId").value;
    const statusEl = document.getElementById("lookupStatus");
    if (claimId === "") {
      statusEl.textContent = "Enter a claim ID first.";
      return;
    }
    try {
      const readClient = client ?? createClient({ chain: testnetAsimov });
      const result = await readClient.readContract({
        address: CONTRACT_ADDRESS,
        functionName: "get_claim",
        args: [Number(claimId)],
      });
      statusEl.textContent = JSON.stringify(result, null, 2);
    } catch (err) {
      statusEl.textContent = "Error: " + err.message;
    }
  });
</script>

</body>
</html>
